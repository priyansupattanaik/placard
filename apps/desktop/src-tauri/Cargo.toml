[package]
name = "placard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
placard-ipc-types = { workspace = true }
placard-core = { workspace = true }
placard-engine = { workspace = true }
placard-library = { workspace = true }
placard-downloader = { workspace = true }
placard-scheduler = { workspace = true }
placard-imaging = { workspace = true }
placard-sources = { workspace = true }
