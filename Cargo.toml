[workspace]
resolver = "2"
members = [
  "crates/ipc-types",
  "crates/core",
  "crates/sources",
  "crates/library",
  "crates/downloader",
  "crates/imaging",
  "crates/engine",
  "crates/scheduler",
  "crates/video-renderer",
  "apps/desktop/src-tauri",
  "apps/desktop/ui",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
blurhash = "0.2.3"
palette = { version = "0.7.6", default-features = false, features = ["std", "approx"] }
governor = "0.10.4"
keyring = "4.2.0"
async-trait = "0.1.88"
dirs = "6.0.0"
tempfile = "3.17"

# Internal crates
placard-ipc-types = { path = "crates/ipc-types" }
placard-core = { path = "crates/core" }
placard-sources = { path = "crates/sources" }
placard-library = { path = "crates/library" }
placard-downloader = { path = "crates/downloader" }
placard-imaging = { path = "crates/imaging" }
placard-engine = { path = "crates/engine" }
placard-scheduler = { path = "crates/scheduler" }
